{
  "plugin_type": "loaders",
  "name": "target-apprise",
  "namespace": "target_apprise",
  "variant": "autoidm",
  "label": "Apprise",
  "docs": "https://hub.meltano.com/loaders/target-apprise--autoidm",
  "repo": "https://github.com/AutoIDM/target-apprise",
  "pip_url": "target-apprise",
  "description": "Apprise allows you to send a notification to almost all of the most popular notification services available to us today such as: Telegram, Discord, Slack, Amazon SNS, Gotify, etc",
  "logo_url": "https://hub.meltano.com/assets/logos/loaders/apprise.png",
  "capabilities": [
    "about",
    "schema-flattening",
    "stream-maps",
    "validate-records"
  ],
  "settings_group_validation": [
    [
      "uri_replacement",
      "uris"
    ]
  ],
  "settings": [
    {
      "name": "add_record_metadata",
      "kind": "boolean",
      "label": "Add Record Metadata",
      "description": "Add metadata to records."
    },
    {
      "name": "batch_size_rows",
      "kind": "integer",
      "label": "Batch Size Rows",
      "description": "Maximum number of rows in each batch."
    },
    {
      "name": "faker_config.locale",
      "kind": "array",
      "label": "Faker Config Locale",
      "description": "One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization"
    },
    {
      "name": "faker_config.seed",
      "kind": "string",
      "label": "Faker Config Seed",
      "description": "Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator"
    },
    {
      "name": "flattening_enabled",
      "kind": "boolean",
      "label": "Flattening Enabled",
      "description": "'True' to enable schema flattening and automatically expand nested properties."
    },
    {
      "name": "flattening_max_depth",
      "kind": "integer",
      "label": "Flattening Max Depth",
      "description": "The max depth to flatten schemas."
    },
    {
      "name": "load_method",
      "kind": "options",
      "value": "append-only",
      "label": "Load Method",
      "description": "The method to use when loading data into the destination. `append-only` will always write all input records whether that records already exists or not. `upsert` will update existing records and insert new records. `overwrite` will delete all existing records and insert all input records.",
      "options": [
        {
          "label": "Append Only",
          "value": "append-only"
        },
        {
          "label": "Upsert",
          "value": "upsert"
        },
        {
          "label": "Overwrite",
          "value": "overwrite"
        }
      ]
    },
    {
      "name": "stream_map_config",
      "kind": "object",
      "label": "Stream Map Config",
      "description": "User-defined config values to be used within map expressions."
    },
    {
      "name": "stream_maps",
      "kind": "object",
      "label": "Stream Maps",
      "description": "Config object for stream maps capability. For more information check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html)."
    },
    {
      "name": "uri_replacement",
      "kind": "boolean",
      "value": false,
      "label": "Uri Replacement",
      "description": "If enabled, allows for uris to be dynamically configured. Any fields in the record that have a name beginning with `_sdc_replace_`, will have their value substituted in for a matching string in the URI. See an example [here](#dynamically-providing-target-emails)."
    },
    {
      "name": "uris",
      "kind": "array",
      "label": "Uris",
      "description": "Array of apprise URIs,checkout https://github.com/caronc/apprise"
    },
    {
      "name": "validate_records",
      "kind": "boolean",
      "value": true,
      "label": "Validate Records",
      "description": "Whether to validate the schema of the incoming streams."
    }
  ],
  "supported_python_versions": [
    "3.8",
    "3.9",
    "3.10",
    "3.11"
  ]
}
