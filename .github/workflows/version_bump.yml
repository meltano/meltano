name: Version bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: auto
        options:
        - auto
        - patch
        - minor
        - major
      prerelease:
        description: "Increase to this prerelease version"
        required: false
        type: choice
        default: none
        options:
        - none
        - alpha
        - beta
        - rc

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  create_release_branch_pr:
    name: Create Release Pull Request
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: docs/package.json
        package-manager-cache: false

    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: false

    - name: Generate MeltyBot token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ secrets.MELTYBOT_APP_CLIENT_ID }}
        private-key: ${{ secrets.MELTYBOT_APP_PRIVATE_KEY }}
        permission-contents: write       # to push the metadata refresh branch
        permission-pull-requests: write  # to open the PR
        permission-members: read         # to look up org membership for changelog thanks

    - name: Bump version
      id: cz-bump
      uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
      with:
        increment: ${{ github.event.inputs.bump != 'auto' && github.event.inputs.bump || '' }}
        prerelease: ${{ github.event.inputs.prerelease != 'none' && github.event.inputs.prerelease || '' }}
        commit: "false"
        push: "false"
        changelog: ${{ github.event.inputs.prerelease == 'none' && 'true' || 'false' }}
        github_token: ${{ steps.app-token.outputs.token }}
        extra_requirements: 'git+https://github.com/meltano/commitizen-version-bump@main'
        changelog_increment_filename: ${{ github.event.inputs.prerelease == 'none' && '_changelog_fragment.md' || '' }}
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Update uv.lock
      run: uv lock

    - name: Update docs/package-lock.json
      working-directory: docs
      run: npm install --package-lock-only

    - name: Draft Release
      id: draft-release
      if: ${{ github.event.inputs.prerelease == 'none' }}
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        draft: true
        body_path: ${{ github.event.inputs.prerelease == 'none' && '_changelog_fragment.md' || '' }}
        tag_name: v${{ steps.cz-bump.outputs.version }}
        prerelease: ${{ github.event.inputs.prerelease != 'none' }}
        token: ${{ steps.app-token.outputs.token }}

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      id: create-pull-request
      with:
        # https://github.com/peter-evans/create-pull-request
        token: ${{ steps.app-token.outputs.token }}
        commit-message: "chore: Bump package version"
        title: "chore: Release v${{ steps.cz-bump.outputs.version }}"
        body: |
          Bump changelog for release v${{ steps.cz-bump.outputs.version }}
        branch: release/v${{ steps.cz-bump.outputs.version }}
        labels: release
        assignees: "${{ github.actor }}"
