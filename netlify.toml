[build]
  # Directory to change to before starting a build.
  base = "docs/"

  # Directory (relative to root of the repo) that contains the deploy-ready
  # HTML files and assets generated by the build.
  publish = "build"

  # Default build command.
  command = "npm install && npm run download-api-snippets && npm run build"

# --- Matatika -> Meltano documentation redirects (docs.matatika.com equivalents) ---

[[redirects]]
  from = "*/docs/how-to-guides/automate-actions/create-a-custom-pipeline"
  to = "/meltano-cloud/automate-actions#create-a-custom-pipeline"
  status = 301
  force = true

